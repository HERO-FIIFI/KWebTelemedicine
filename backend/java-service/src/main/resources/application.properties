spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/telemedicine}
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
springdoc.swagger-ui.path=/docs
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://localhost:3000}
app.rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:120}
