<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telemedicine MVP</title><link rel="stylesheet" href="styles.css"></head>
<body><main><header><p class="eyebrow">Korle-Bu Teaching Hospital</p><h1>Patient registry</h1><p class="muted">MVP dashboard for managing telemedicine patients.</p></header>
<section class="card"><h2 id="form-title">Add patient</h2><form id="patient-form"><input type="hidden" id="patient-id"><label>Name<input id="name" required maxlength="120"></label><label>Age<input id="age" type="number" min="0" max="130" required></label><label>Diagnosis<input id="diagnosis" required maxlength="500"></label><label>Doctor<input id="doctor" required maxlength="120"></label><div class="actions"><button type="submit">Save patient</button><button type="button" id="cancel" class="secondary" hidden>Cancel</button></div></form><p id="message" role="status"></p></section>
<section><div class="section-heading"><h2>Patients</h2><button id="refresh" class="secondary">Refresh</button></div><div id="patients" class="grid"><p class="muted">Loading…</p></div></section></main><script src="scripts.js"></script></body></html>
