name: build
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend/java-service}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: maven}
      - run: mvn -B test
